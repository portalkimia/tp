<script>
(() => {
'use strict';
const base=location.href.split('?')[0],q=new URLSearchParams(location.search),page=({Dashboard:'index',Index:'index','anggaran-rab':'Budget',transaksi:'Transactions','checklist-persiapan':'Checklist','vendor-pembayaran':'Vendors',tabungan:'Savings',laporan:'Reports',pengaturan:'Settings'})[q.get('page')]||q.get('page')||'index';
const routes=[['index','Dashboard','dashboard'],['Budget','Anggaran & RAB','anggaran-rab'],['Transactions','Transaksi','transaksi'],['Checklist','Checklist Persiapan','checklist-persiapan'],['Vendors','Vendor & Pembayaran','vendor-pembayaran'],['Savings','Tabungan','tabungan'],['Reports','Laporan','laporan'],['Settings','Pengaturan','pengaturan']];
const owners=['Cowo','Cewe','Bersama','Keluarga'],priorities=['Wajib','Penting','Opsional'],statuses=['Belum mulai','Berjalan','Menunggu','Selesai'],methods=['Transfer Bank','QRIS / E-Wallet','Tunai','Kartu Kredit'];
const api=(m,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[m](...a));
window.WeddingFund={snapshot:()=>api('getAppSnapshot'),save:(s,r)=>api('saveRecord',s,r),remove:(s,id)=>api('deleteRecord',s,id),saveSettings:v=>api('saveSettings',v)};
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cash=x=>'Rp '+Number(x||0).toLocaleString('id-ID'),date=x=>x?String(x).slice(0,10):'',today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
let db=null,owner=localStorage.getItem('wf-owner')||'Bersama',filter={q:'',owner:'Semua',from:'',to:''},checkView='list',checkStatus='Semua',txType='Semua',report={from:'',to:'',owner:'Semua'};
document.querySelectorAll('a[data-path]').forEach(a=>{const k=a.dataset.path.toLowerCase(),r=routes.find(x=>x[2]===k)||(k==='anggaran'?routes[1]:k==='vendor-dan-pembayaran'?routes[4]:null);if(r)a.href=base+'?page='+encodeURIComponent(r[0]);});
const main=document.querySelector('main');if(!main)return;const preview=main.innerHTML;main.innerHTML='<div id="wf-root"></div><details style="margin:18px 0"><summary>Pratinjau Stitch (data contoh, bukan data aktual)</summary>'+preview+'</details>';
const root=document.getElementById('wf-root'),modal=document.createElement('div');modal.id='wf-modal';document.body.appendChild(modal);const badge=document.getElementById('wedding-fund-connection');
const css='#wf-root{font:14px Arial,sans-serif;color:#263344;padding:16px 0 32px;max-width:1500px;margin:auto}#wf-root *{box-sizing:border-box}.wf-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.wf-head h1{margin:0;color:#71383e;font-size:26px}.wf-sub{color:#697386;margin-top:5px}.wf-actions,.wf-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wf-btn,.wf-input,.wf-select,.wf-area{border:1px solid #dfcece;border-radius:9px;padding:9px 11px;background:white;color:#344054;font:inherit}.wf-btn{cursor:pointer;font-weight:600}.wf-primary{background:#8e464c;color:white}.wf-danger{color:#a4262b}.wf-card{background:white;border:1px solid #eadfe0;border-radius:14px;padding:15px}.wf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin:12px 0}.wf-metric small{color:#697386}.wf-metric strong{display:block;color:#71383e;font-size:21px;margin:8px 0}.wf-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.wf-sec{margin:16px 0}.wf-sec h2{font-size:17px;margin:0 0 10px}.wf-table-wrap{overflow:auto}.wf-table{border-collapse:collapse;width:100%;min-width:640px}.wf-table th,.wf-table td{text-align:left;padding:9px 8px;border-bottom:1px solid #eee;vertical-align:top}.wf-table th{font-size:12px;color:#667085}.wf-empty{text-align:center;color:#667085;padding:22px}.wf-pill{border-radius:20px;background:#f7e9ea;color:#763f44;padding:4px 8px;font-size:11px}.wf-modal{display:none;position:fixed;inset:0;z-index:6000;background:#17212f99;align-items:center;justify-content:center;padding:14px;overflow:auto}.wf-modal.open{display:flex}.wf-dialog{background:white;border-radius:16px;width:min(650px,100%);max-height:94vh;overflow:auto;padding:20px}.wf-dialog h2{color:#71383e;margin:0 0 10px}.wf-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.wf-field{display:grid;gap:5px;margin:9px 0}.wf-field span{font-size:12px;font-weight:600;color:#596273}.wf-wide,.wf-form footer,.wf-error{grid-column:1/-1}.wf-form footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.wf-bar{height:8px;background:#f0e9e9;border-radius:8px}.wf-bar i{display:block;background:#8e464c;height:100%;border-radius:8px}.wf-line{padding:9px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px}.wf-board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:9px;overflow:auto}.wf-column{padding:10px;border-radius:12px;background:#f7f4f3}.wf-task{padding:10px;border-radius:9px;background:white;margin-top:8px}.wf-cal{display:grid;grid-template-columns:repeat(7,minmax(80px,1fr));gap:4px;overflow:auto}.wf-day{min-height:70px;padding:6px;border:1px solid #eee;border-radius:8px;background:white;font-size:11px}.wf-notice{padding:12px;background:#fff4de;border-radius:10px}@media(max-width:700px){.wf-head h1{font-size:22px}.wf-form{grid-template-columns:1fr}.wf-wide,.wf-form footer,.wf-error{grid-column:auto}}@media print{aside,header,#wedding-fund-connection,#wf-preview,.wf-actions,.wf-toolbar{display:none!important}.wf-card{box-shadow:none!important}}';
const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
const title=(routes.find(x=>x[0]===page)||[])[1]||'Wedding Fund';
const safeLink=value=>{try{const u=new URL(String(value||''),location.href);return ['http:','https:'].includes(u.protocol)?esc(u.href):'';}catch(e){return '';}};
const catName=id=>esc((db.Categories||[]).find(x=>String(x.id)===String(id))?.name||'—'),vendorName=id=>esc((db.Vendors||[]).find(x=>String(x.id)===String(id))?.name||'—');
const isExpense=r=>['pengeluaran','expense'].includes(String(r.type||'').toLowerCase());
const catSpent=()=>{const m={};(db.Transactions||[]).filter(isExpense).forEach(x=>{if(x.categoryId)m[x.categoryId]=(m[x.categoryId]||0)+Number(x.amount||0)});return m;};
const vendorPaid=()=>{const m={};(db.Transactions||[]).filter(x=>isExpense(x)&&x.vendorId).forEach(x=>m[x.vendorId]=(m[x.vendorId]||0)+Number(x.amount||0));return m;};
const ownerOptions=owners.map(x=>({value:x,label:x})),priorityOptions=priorities.map(x=>({value:x,label:x}));
function fld(label,key,val,type,opts,wide,req){let c='';if(type==='select')c='<select class="wf-select" name="'+key+'" '+(req?'required':'')+'>'+opts.map(o=>'<option value="'+esc(o.value)+'" '+(String(o.value)===String(val)?'selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select>';else if(type==='category')c='<select class="wf-select" name="categoryId"><option value="">Pilih kategori</option>'+(db.Categories||[]).filter(x=>x.active!==false&&String(x.active)!=='FALSE').map(x=>'<option value="'+esc(x.id)+'" '+(String(x.id)===String(val)?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';else if(type==='vendor')c='<select class="wf-select" name="vendorId"><option value="">Tanpa vendor</option>'+(db.Vendors||[]).map(x=>'<option value="'+esc(x.id)+'" '+(String(x.id)===String(val)?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';else if(type==='textarea')c='<textarea class="wf-area" name="'+key+'" rows="3">'+esc(val)+'</textarea>';else if(type==='checkbox')c='<input name="'+key+'" type="checkbox" '+(val===true||String(val)==='TRUE'?'checked':'')+'>';else c='<input class="wf-input" name="'+key+'" type="'+type+'" value="'+esc(type==='date'?date(val):val)+'" '+(req?'required':'')+(type==='number'?' min="0" step="1"':'')+'>';return '<label class="wf-field '+(wide?'wf-wide':'')+'"><span>'+esc(label)+(req?' *':'')+'</span>'+c+'</label>';}
const modelFields={
Categories:r=>[fld('Nama kategori','name',r.name,'text',null,false,true),fld('Prioritas','priority',r.priority||'Penting','select',priorityOptions),fld('Jenis','kind',r.kind||'budget','select',[{value:'budget',label:'Anggaran'},{value:'checklist',label:'Checklist'}]),fld('Aktif','active',r.active===undefined?true:r.active,'checkbox')],
Budget:r=>[fld('Kategori','categoryId',r.categoryId,'category',null,false,true),fld('Anggaran (Rp)','plannedAmount',r.plannedAmount||0,'number',null,false,true),fld('PIC utama','owner',r.owner||owner,'select',ownerOptions),fld('Catatan','notes',r.notes,'textarea',null,true)],
Transactions:r=>[fld('Tanggal','date',r.date||today(),'date',null,false,true),fld('Jenis','type',r.type||'Pengeluaran','select',[{value:'Pengeluaran',label:'Pengeluaran'},{value:'Pemasukan',label:'Pemasukan'}]),fld('Nominal (Rp)','amount',r.amount,'number',null,false,true),fld('Kategori','categoryId',r.categoryId,'category'),fld('PIC','owner',r.owner||owner,'select',ownerOptions),fld('Metode','paymentMethod',r.paymentMethod||'Transfer Bank','select',['Transfer Bank','QRIS / E-Wallet','Tunai','Kartu Kredit'].map(x=>({value:x,label:x}))),fld('Vendor','vendorId',r.vendorId,'vendor'),fld('Tautan bukti','proofLink',r.proofLink,'url'),fld('Keterangan','description',r.description,'text',null,true,true),fld('Catatan','notes',r.notes,'textarea',null,true)],
Savings:r=>[fld('Tanggal','date',r.date||today(),'date',null,false,true),fld('Sumber dana','source',r.source,'text',null,false,true),fld('Nominal (Rp)','amount',r.amount,'number',null,false,true),fld('PIC/penyumbang','owner',r.owner||owner,'select',ownerOptions),fld('Rekening','account',r.account,'text'),fld('Terverifikasi','verified',r.verified||false,'checkbox'),fld('Keterangan','description',r.description,'text',null,true),fld('Tautan bukti','proofLink',r.proofLink,'url',null,true)],
Vendors:r=>[fld('Nama vendor','name',r.name,'text',null,false,true),fld('Kategori RAB','categoryId',r.categoryId,'category'),fld('Kontak','contact',r.contact,'text'),fld('Kontrak (Rp)','contractAmount',r.contractAmount||0,'number'),fld('Tautan invoice/kontrak','invoiceLink',r.invoiceLink,'url'),fld('Jatuh tempo','nextDueDate',r.nextDueDate,'date'),fld('Catatan','notes',r.notes,'textarea',null,true)],
Checklist:r=>[fld('Nama tugas','title',r.title,'text',null,false,true),fld('Kategori RAB','categoryId',r.categoryId,'category'),fld('Status','status',r.status||'Belum mulai','select',statuses.map(x=>({value:x,label:x}))),fld('Tenggat','dueDate',r.dueDate,'date'),fld('PIC','owner',r.owner||owner,'select',ownerOptions),fld('Estimasi biaya (Rp)','estimatedAmount',r.estimatedAmount||0,'number'),fld('Vendor','vendorId',r.vendorId,'vendor'),fld('Catatan','notes',r.notes,'textarea',null,true)]
};
function header(sub,actions){return '<div class="wf-head"><div><h1>'+esc(title)+'</h1><div class="wf-sub">'+esc(sub)+'</div></div><div class="wf-actions">'+(actions||'')+'</div></div>';}
function btn(text,act,primary,attrs){return '<button class="wf-btn '+(primary?'wf-primary':'')+'" type="button" data-action="'+act+'" '+(attrs||'')+'>'+text+'</button>';}
function actions(sheet,r){return '<div class="wf-actions"><button class="wf-btn" data-action="edit" data-sheet="'+sheet+'" data-id="'+esc(r.id)+'">Ubah</button><button class="wf-btn wf-danger" data-action="delete" data-sheet="'+sheet+'" data-id="'+esc(r.id)+'">Hapus</button></div>';}
function table(head,body){return '<div class="wf-card wf-table-wrap"><table class="wf-table"><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(body||'<tr><td class="wf-empty" colspan="'+head.length+'">Belum ada data.</td></tr>')+'</tbody></table></div>';}
function filtered(rows,keys){return rows.filter(x=>(filter.owner==='Semua'||x.owner===filter.owner)&&(!filter.q||keys.some(k=>String(x[k]||'').toLowerCase().includes(filter.q)))&&(!filter.from||String(x.date||x.dueDate||'')>=filter.from)&&(!filter.to||String(x.date||x.dueDate||'')<=filter.to));}
function filters(){return '<div class="wf-toolbar"><input class="wf-input" id="wf-q" placeholder="Cari…" value="'+esc(filter.q)+'"><select class="wf-select" id="wf-owner"><option value="Semua">Semua PIC</option>'+owners.map(x=>'<option '+(filter.owner===x?'selected':'')+'>'+x+'</option>').join('')+'</select><input class="wf-input" id="wf-from" type="date" value="'+filter.from+'"><input class="wf-input" id="wf-to" type="date" value="'+filter.to+'">'+btn('Reset filter','reset-filter')+'</div>';}
function home(){
  const summary=db.summary||{};
  const cards=[['Total RAB',summary.planned,'Budget'],['Pengeluaran',summary.expenses,'Transactions'],['Sisa anggaran',summary.planned-summary.expenses,'Budget'],['Tabungan',summary.savings,'Savings'],['Tagihan vendor',summary.vendorDue,'Vendors'],['Tugas terbuka',summary.openTasks,'Checklist']].map(x=>'<a class="wf-card wf-metric" href="'+base+'?page='+x[2]+'" style="color:inherit;text-decoration:none"><small>'+x[0]+'</small><strong>'+cash(x[1])+'</strong>Buka →</a>').join('');
  const tx=(summary.recentTransactions||[]).map(x=>'<div class="wf-line"><span>'+esc(x.description)+' · '+date(x.date)+'</span><b>'+cash(x.amount)+'</b></div>').join('')||'<p class="wf-empty">Belum ada transaksi.</p>';
  const tasks=(db.Checklist||[]).filter(x=>! /done|selesai/i.test(String(x.status))).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))).slice(0,5).map(x=>'<div class="wf-line"><span>'+esc(x.title)+' · '+esc(x.owner)+' · '+date(x.dueDate)+'</span><span class="wf-pill">'+esc(x.status)+'</span></div>').join('')||'<p class="wf-empty">Belum ada tugas terbuka.</p>';
  return header(db.Settings.weddingDate?'Hari acara: '+date(db.Settings.weddingDate):'Ringkasan rencana pernikahan',btn('＋ Transaksi','add-Transactions',true)+btn('＋ Tabungan','add-Savings')+btn('＋ Checklist','add-Checklist'))+'<div class="wf-grid">'+cards+'</div>'+dueReminders()+'<div class="wf-split"><section class="wf-card wf-sec"><h2>Transaksi terbaru</h2>'+tx+'<a href="'+base+'?page=Transactions">Semua transaksi →</a></section><section class="wf-card wf-sec"><h2>Tugas prioritas</h2>'+tasks+'<a href="'+base+'?page=Checklist">Semua checklist →</a></section></div>';
}
function dueReminders(){
  if(String((db.Settings||{}).remindersEnabled).toLowerCase()==='false')return '';
  const horizon=Math.max(0,Number((db.Settings||{}).reminderDays)||7),todayMs=Date.parse(today()+'T00:00:00Z');
  const due=(db.Checklist||[]).map(x=>({item:x,days:Math.floor((Date.parse(date(x.dueDate)+'T00:00:00Z')-todayMs)/86400000)})).filter(x=>x.item.dueDate&&!/done|selesai/i.test(String(x.item.status))&&x.days<=horizon).sort((a,b)=>a.days-b.days).slice(0,6);
  const lines=due.map(x=>'<div class="wf-line"><span>'+esc(x.item.title)+' · '+esc(x.item.owner||'Bersama')+'</span><span class="wf-pill">'+(x.days<0?'Terlambat '+Math.abs(x.days)+' hari':x.days===0?'Hari ini':'Dalam '+x.days+' hari')+'</span></div>').join('');
  return '<section class="wf-card wf-sec"><h2>Pengingat tenggat · '+horizon+' hari</h2>'+(lines||'<p class="wf-empty">Tidak ada tugas yang jatuh tempo dalam waktu dekat.</p>')+'<a href="'+base+'?page=Checklist">Buka checklist →</a></section>';
}
function budget(){const actual={};(db.Transactions||[]).filter(x=>['pengeluaran','expense'].includes(String(x.type).toLowerCase())).forEach(x=>actual[x.categoryId]=(actual[x.categoryId]||0)+Number(x.amount||0));const cats=(db.Categories||[]).filter(x=>x.active!==false&&String(x.active)!=='FALSE');const rows=cats.map(c=>{const b=(db.Budget||[]).find(x=>String(x.categoryId)===String(c.id)),p=Number(b?.plannedAmount||0),a=actual[c.id]||0,pc=p?Math.min(100,Math.round(a/p*100)):0;return '<tr><td>'+esc(c.name)+' <span class="wf-pill">'+esc(c.priority)+'</span></td><td>'+cash(p)+'</td><td>'+cash(a)+'</td><td><div class="wf-bar"><i style="width:'+pc+'%"></i></div>'+pc+'%</td><td>'+(b?actions('Budget',b):btn('Atur anggaran','set-budget',false,'data-category="'+esc(c.id)+'"'))+'</td></tr>';}).join('');return header('Rencana per kategori dan realisasi dari transaksi.',btn('＋ Kategori','add-Categories',true)+btn('CSV','export-Budget'))+table(['Kategori','Anggaran','Aktual','Serapan','Aksi'],rows)+'<section class="wf-card wf-sec"><h2>Kategori</h2>'+table(['Nama','Prioritas','Aksi'],cats.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.priority)+'</td><td>'+actions('Categories',c)+'</td></tr>').join(''))+'</section>';}
function transactionRows(){return filtered(db.Transactions||[],['description','type','notes','paymentMethod']).filter(x=>txType==='Semua'||(txType==='Pengeluaran'?isExpense(x):!isExpense(x))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));}
function transactions(){
  const rows=transactionRows();
  const options=['Semua','Pengeluaran','Pemasukan'].map(x=>'<option '+(txType===x?'selected':'')+'>'+x+'</option>').join('');
  return header('Semua pemasukan dan pengeluaran bersama.',btn('＋ Transaksi','add-Transactions',true)+btn('CSV','export-Transactions')+btn('Cetak/PDF','print'))+filters()+'<div class="wf-toolbar"><select class="wf-select" id="wf-type">'+options+'</select></div>'+table(['Tanggal','Jenis','Keterangan','Kategori','Vendor','PIC','Jumlah','Bukti','Aksi'],rows.map(x=>'<tr><td>'+date(x.date)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.description)+'</td><td>'+catName(x.categoryId)+'</td><td>'+vendorName(x.vendorId)+'</td><td>'+esc(x.owner)+'</td><td>'+cash(x.amount)+'</td><td>'+(safeLink(x.proofLink)?'<a href="'+safeLink(x.proofLink)+'" target="_blank" rel="noopener">Bukti</a>':'—')+'</td><td>'+actions('Transactions',x)+'</td></tr>').join(''));
}
function checklistRows(){return filtered(db.Checklist||[],['title','status','notes']).filter(x=>checkStatus==='Semua'||x.status===checkStatus);}
function checklist(){
  const rows=checklistRows();let body='';
  if(checkView==='board')body='<div class="wf-board">'+statuses.map(st=>'<section class="wf-column"><b>'+st+'</b>'+rows.filter(x=>x.status===st).map(x=>'<article class="wf-task"><b>'+esc(x.title)+'</b><p>'+date(x.dueDate)+' · '+esc(x.owner)+'</p>'+actions('Checklist',x)+'</article>').join('')+'</section>').join('')+'</div>';
  else if(checkView==='calendar'){const d=new Date(),first=new Date(d.getFullYear(),d.getMonth(),1),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div></div>');for(let day=1;day<=n;day++){const key=new Date(d.getFullYear(),d.getMonth(),day).toLocaleDateString('en-CA');cells.push('<div class="wf-day"><b>'+day+'</b>'+rows.filter(x=>date(x.dueDate)===key).map(x=>'<div>'+esc(x.title)+'</div>').join('')+'</div>');}body='<div class="wf-card"><h2>'+first.toLocaleDateString('id-ID',{month:'long',year:'numeric'})+'</h2><div class="wf-cal">'+['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>'<b>'+x+'</b>').join('')+cells.join('')+'</div></div>';}
  else body=table(['Tugas','Status','Tenggat','Kategori','Vendor','PIC','Estimasi','Aksi'],rows.map(x=>'<tr><td>'+esc(x.title)+'<br><small>'+esc(x.notes)+'</small></td><td>'+esc(x.status)+'</td><td>'+date(x.dueDate)+'</td><td>'+catName(x.categoryId)+'</td><td>'+vendorName(x.vendorId)+'</td><td>'+esc(x.owner)+'</td><td>'+cash(x.estimatedAmount)+'</td><td>'+actions('Checklist',x)+'</td></tr>').join(''));
  const statusOptions=['Semua',...statuses].map(x=>'<option '+(checkStatus===x?'selected':'')+'>'+x+'</option>').join('');
  return header('Tugas, penanggung jawab, tenggat, dan vendor.',btn('＋ Tugas','add-Checklist',true)+btn('CSV','export-Checklist'))+filters()+'<div class="wf-toolbar"><label>Status <select id="wf-check-status" class="wf-select">'+statusOptions+'</select></label>'+btn('Daftar','check-list',checkView==='list')+btn('Kanban','check-board',checkView==='board')+btn('Kalender','check-calendar',checkView==='calendar')+'</div>'+body;
}
function vendors(){const paid={};(db.Transactions||[]).filter(x=>['pengeluaran','expense'].includes(String(x.type).toLowerCase())&&x.vendorId).forEach(x=>paid[x.vendorId]=(paid[x.vendorId]||0)+Number(x.amount||0));const rows=(db.Vendors||[]).slice().sort((a,b)=>String(a.nextDueDate).localeCompare(String(b.nextDueDate))).map(v=>'<tr><td><b>'+esc(v.name)+'</b><br>'+esc(v.contact)+'</td><td>'+catName(v.categoryId)+'</td><td>'+cash(v.contractAmount)+'</td><td>'+cash(paid[v.id])+'</td><td>'+cash(Math.max(0,Number(v.contractAmount||0)-(paid[v.id]||0)))+'</td><td>'+date(v.nextDueDate)+'</td><td>'+btn('Bayar','pay-vendor',false,'data-id="'+esc(v.id)+'"')+actions('Vendors',v)+'</td></tr>').join('');return header('Kontrak dan termin. Pembayaran akan membuat transaksi terkait.',btn('＋ Vendor','add-Vendors',true)+btn('CSV','export-Vendors'))+table(['Vendor/kontak','Kategori','Kontrak','Terbayar','Sisa','Jatuh tempo','Aksi'],rows);}
function savings(){const total=(db.Savings||[]).reduce((s,x)=>s+Number(x.amount||0),0);const rows=(db.Savings||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>'<tr><td>'+date(x.date)+'</td><td>'+esc(x.source)+'</td><td>'+esc(x.owner)+'</td><td>'+esc(x.account)+'</td><td>'+cash(x.amount)+'</td><td>'+(x.verified?'Ya':'Belum')+'</td><td>'+actions('Savings',x)+'</td></tr>').join('');return header('Setoran dan kontribusi dana pasangan.',btn('＋ Setoran','add-Savings',true)+btn('CSV','export-Savings'))+'<div class="wf-card wf-metric"><small>Total tabungan</small><strong>'+cash(total)+'</strong></div>'+table(['Tanggal','Sumber','PIC','Rekening','Jumlah','Terverifikasi','Aksi'],rows);}
function reportRows(){return (db.Transactions||[]).filter(x=>(!report.from||date(x.date)>=report.from)&&(!report.to||date(x.date)<=report.to)&&(report.owner==='Semua'||x.owner===report.owner));}
function reports(){
  const tx=reportRows(),exp=tx.filter(isExpense),inc=tx.filter(x=>!isExpense(x)),sum=rows=>rows.reduce((n,x)=>n+Number(x.amount||0),0),cat={},pic={},vendor={};
  exp.forEach(x=>{const category=(db.Categories||[]).find(c=>String(c.id)===String(x.categoryId)),vendorRow=(db.Vendors||[]).find(v=>String(v.id)===String(x.vendorId));const c=category?category.name:'Tanpa kategori',p=x.owner||'Bersama',v=vendorRow?vendorRow.name:'Tanpa vendor';cat[c]=(cat[c]||0)+Number(x.amount||0);pic[p]=(pic[p]||0)+Number(x.amount||0);vendor[v]=(vendor[v]||0)+Number(x.amount||0);});
  const budgetRows=(db.Categories||[]).map(c=>{const b=(db.Budget||[]).find(x=>String(x.categoryId)===String(c.id)),a=exp.filter(x=>String(x.categoryId)===String(c.id)).reduce((n,r)=>n+Number(r.amount||0),0);return '<tr><td>'+esc(c.name)+'</td><td>'+cash(b?.plannedAmount)+'</td><td>'+cash(a)+'</td><td>'+cash(Number(b?.plannedAmount||0)-a)+'</td></tr>';}).join('');
  const txRows=tx.map(x=>'<tr><td>'+date(x.date)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.description)+'</td><td>'+catName(x.categoryId)+'</td><td>'+esc(x.owner)+'</td><td>'+cash(x.amount)+'</td></tr>').join('');
  const breakdown=values=>table(['Nama','Jumlah'],Object.keys(values).sort((a,b)=>values[b]-values[a]).map(k=>'<tr><td>'+esc(k)+'</td><td>'+cash(values[k])+'</td></tr>').join(''));
  return header('RAB vs realisasi, arus kas, biaya per kategori, vendor, dan PIC.',btn('Cetak/PDF','print')+btn('CSV','export-Reports'))+'<div class="wf-toolbar">Dari <input class="wf-input" id="wf-rfrom" type="date" value="'+report.from+'">Sampai <input class="wf-input" id="wf-rto" type="date" value="'+report.to+'"><select id="wf-rowner" class="wf-select"><option>Semua</option>'+owners.map(x=>'<option '+(report.owner===x?'selected':'')+'>'+x+'</option>').join('')+'</select>'+btn('Terapkan','apply-report')+'</div><div class="wf-grid"><div class="wf-card wf-metric"><small>Pemasukan</small><strong>'+cash(sum(inc))+'</strong></div><div class="wf-card wf-metric"><small>Pengeluaran</small><strong>'+cash(sum(exp))+'</strong></div><div class="wf-card wf-metric"><small>Arus bersih</small><strong>'+cash(sum(inc)-sum(exp))+'</strong></div></div><div class="wf-split"><section class="wf-card wf-sec"><h2>Pengeluaran per kategori</h2>'+breakdown(cat)+'</section><section class="wf-card wf-sec"><h2>Pengeluaran per PIC</h2>'+breakdown(pic)+'</section><section class="wf-card wf-sec"><h2>Pengeluaran per vendor</h2>'+breakdown(vendor)+'</section></div><section class="wf-card wf-sec"><h2>Anggaran vs aktual</h2>'+table(['Kategori','Anggaran','Aktual','Sisa'],budgetRows)+'</section><section class="wf-card wf-sec"><h2>Rincian transaksi</h2>'+table(['Tanggal','Jenis','Keterangan','Kategori','PIC','Nominal'],txRows)+'</section>';
}
function settings(){const s=db.Settings||{},pairs=[['Nama pasangan pertama','partnerOneName','text'],['Nama pasangan kedua','partnerTwoName','text'],['Tanggal acara','weddingDate','date'],['Target anggaran (Rp)','budgetTarget','number'],['Target tamu','guestTarget','number'],['Motto','motto','text'],['Pengingat dalam aplikasi','remindersEnabled','checkbox'],['Pengingat (hari sebelum)','reminderDays','number']];const controls=pairs.map(x=>fld(x[0],x[1],s[x[1]]===undefined?(x[1]==='remindersEnabled'?true:''):s[x[1]],x[2])).join('');return header('Profil, tanggal acara, target, pengingat, dan backup.',btn('Unduh backup JSON','backup'))+'<form id="wf-settings" class="wf-card wf-form">'+controls+'<div id="wf-settings-msg" class="wf-error"></div><footer><button class="wf-btn wf-primary">Simpan pengaturan</button></footer></form><p class="wf-sub">Kedua akun yang diizinkan memiliki akses penuh; PIC hanya label tanggung jawab.</p>';}
function upcomingVendors(){const paid=spentVendor(),rows=(db.Vendors||[]).filter(v=>Number(v.contractAmount||0)>(paid[v.id]||0)).sort((a,b)=>String(a.nextDueDate).localeCompare(String(b.nextDueDate))).slice(0,5);return '<section class="wf-card wf-sec"><h2>Termin vendor berikutnya</h2>'+(rows.map(v=>'<div class="wf-line"><span>'+esc(v.name)+' · '+date(v.nextDueDate)+'</span><b>'+cash(Number(v.contractAmount)-(paid[v.id]||0))+'</b></div>').join('')||'<p class="wf-empty">Belum ada tagihan vendor.</p>')+'<a href="'+base+'?page=Vendors">Kelola vendor →</a></section>';}
function render(){const fn={index:home,Budget:budget,Transactions:transactions,Checklist:checklist,Vendors:vendors,Savings:savings,Reports:reports,Settings:settings}[page]||home;root.innerHTML=fn()+(page==='index'?upcomingVendors():'');bind();}
async function refresh(){db=await api('getAppSnapshot');render();if(badge)badge.textContent='Data tersambung · '+owner;}
function close(){modal.className='wf-modal';modal.innerHTML='';}
function openForm(sheet,r){r=r||{};const labels={Categories:'kategori',Budget:'anggaran kategori',Transactions:'transaksi',Savings:'setoran tabungan',Vendors:'vendor',Checklist:'tugas'},fields=modelFields[sheet](r).join('');modal.className='wf-modal open';modal.innerHTML='<div class="wf-dialog"><h2>'+(r.id?'Ubah ':'Tambah ')+labels[sheet]+'</h2><form id="wf-record" class="wf-form">'+fields+'<div id="wf-error" class="wf-error"></div><footer><button type="button" class="wf-btn" data-action="close">Batal</button><button class="wf-btn wf-primary">Simpan</button></footer></form></div>';document.getElementById('wf-record').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),x=Object.fromEntries(fd.entries());e.currentTarget.querySelectorAll('input[type=checkbox]').forEach(c=>x[c.name]=c.checked);['amount','plannedAmount','contractAmount','estimatedAmount'].forEach(k=>{if(x[k]!==undefined)x[k]=Number(x[k]||0)});if(r.id)x.id=r.id;try{await api('saveRecord',sheet,x);await refresh();close();}catch(err){document.getElementById('wf-error').textContent=err.message||String(err);}};}
function payment(v){const paid=(db.Transactions||[]).filter(x=>x.vendorId===v.id&&['pengeluaran','expense'].includes(String(x.type).toLowerCase())).reduce((s,x)=>s+Number(x.amount||0),0),due=Math.max(0,Number(v.contractAmount||0)-paid);modal.className='wf-modal open';modal.innerHTML='<div class="wf-dialog"><h2>Pembayaran · '+esc(v.name)+'</h2><p>Sisa kontrak '+cash(due)+'</p><form id="wf-pay" class="wf-form">'+fld('Tanggal','date',today(),'date',null,false,true)+fld('Nominal (Rp)','amount','','number',null,false,true)+fld('PIC','owner',owner,'select',ownerOptions)+fld('Metode','paymentMethod','Transfer Bank','select',methods.map(x=>({value:x,label:x})))+fld('Tautan bukti','proofLink','','url')+fld('Catatan','notes','','textarea',null,true)+'<div id="wf-error" class="wf-error"></div><footer><button type="button" class="wf-btn" data-action="close">Batal</button><button class="wf-btn wf-primary">Simpan pembayaran</button></footer></form></div>';document.getElementById('wf-pay').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget));x.type='Pengeluaran';x.vendorId=v.id;x.categoryId=v.categoryId||'';x.description='Pembayaran vendor: '+v.name;x.amount=Number(x.amount);try{await api('saveRecord','Transactions',x);await refresh();close();}catch(err){document.getElementById('wf-error').textContent=err.message||String(err);}};}
function download(name,rows){if(!rows.length){alert('Belum ada data.');return;}const cols=Array.from(new Set(rows.flatMap(x=>Object.keys(x)))),quote=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"',csv='\ufeff'+[cols.map(quote).join(','),...rows.map(r=>cols.map(k=>quote(r[k])).join(','))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function act(action,el){if(action==='add-Categories')openForm('Categories');if(action==='add-Transactions')openForm('Transactions',{date:today(),type:'Pengeluaran',owner:owner});if(action==='add-Checklist')openForm('Checklist',{status:'Belum mulai',owner:owner});if(action==='add-Vendors')openForm('Vendors');if(action==='add-Savings')openForm('Savings',{date:today(),owner:owner});if(action==='set-budget'){const id=el.dataset.category,old=(db.Budget||[]).find(x=>String(x.categoryId)===String(id));openForm('Budget',old||{categoryId:id});}if(action==='edit'){const r=(db[el.dataset.sheet]||[]).find(x=>String(x.id)===el.dataset.id);if(r)openForm(el.dataset.sheet,r);}if(action==='delete')del(el.dataset.sheet,el.dataset.id);if(action==='close')close();if(action==='check-list'){checkView='list';render();}if(action==='check-board'){checkView='board';render();}if(action==='check-calendar'){checkView='calendar';render();}if(action==='pay-vendor'){const v=(db.Vendors||[]).find(x=>String(x.id)===el.dataset.id);if(v)payment(v);}if(action==='print')window.print();if(action==='reset-filter'){filter={q:'',owner:'Semua',from:'',to:''};txType='Semua';checkStatus='Semua';render();}if(action==='apply-report'){report={from:document.getElementById('wf-rfrom').value,to:document.getElementById('wf-rto').value,owner:document.getElementById('wf-rowner').value};render();}if(action==='export-Budget')download('wedding-fund-rab.csv',(db.Categories||[]).map(c=>{const b=(db.Budget||[]).find(x=>String(x.categoryId)===String(c.id));return {kategori:c.name,prioritas:c.priority,anggaran:Number(b?.plannedAmount||0),realisasi:spentCategory()[c.id]||0,sisa:Number(b?.plannedAmount||0)-(spentCategory()[c.id]||0)};}));if(action==='export-Transactions')download('wedding-fund-transaksi.csv',transactionRows().map(x=>Object.assign({},x,{categoryName:catName(x.categoryId),vendorName:vendorName(x.vendorId)})));if(action==='export-Checklist')download('wedding-fund-checklist.csv',checklistRows().map(x=>Object.assign({},x,{categoryName:catName(x.categoryId),vendorName:vendorName(x.vendorId)})));if(action==='export-Vendors')download('wedding-fund-vendor.csv',(db.Vendors||[]).map(x=>Object.assign({},x,{terbayar:spentVendor()[x.id]||0,sisa:Math.max(0,Number(x.contractAmount||0)-(spentVendor()[x.id]||0))})));if(action==='export-Savings')download('wedding-fund-tabungan.csv',db.Savings||[]);if(action==='export-Reports')download('wedding-fund-laporan.csv',reportRows().map(x=>Object.assign({},x,{categoryName:catName(x.categoryId),vendorName:vendorName(x.vendorId)})));if(action==='backup'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({createdAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}));a.download='wedding-fund-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}}
function spentCategory(){const m={};(db.Transactions||[]).filter(isExpense).forEach(x=>m[x.categoryId]=(m[x.categoryId]||0)+Number(x.amount||0));return m;}
function spentVendor(){const m={};(db.Transactions||[]).filter(x=>isExpense(x)&&x.vendorId).forEach(x=>m[x.vendorId]=(m[x.vendorId]||0)+Number(x.amount||0));return m;}
async function del(sheet,id){if(!confirm('Hapus data ini?'))return;try{await api('deleteRecord',sheet,id);await refresh();}catch(e){alert(e.message||String(e));}}
function bind(){root.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>act(x.dataset.action,x));const q=document.getElementById('wf-q');if(q)q.oninput=()=>{filter.q=q.value.toLowerCase();const p=q.selectionStart;render();const n=document.getElementById('wf-q');n.focus();n.setSelectionRange(p,p);};const own=document.getElementById('wf-owner');if(own)own.onchange=()=>{filter.owner=own.value;render();};const from=document.getElementById('wf-from');if(from)from.onchange=()=>{filter.from=from.value;render();};const to=document.getElementById('wf-to');if(to)to.onchange=()=>{filter.to=to.value;render();};const typ=document.getElementById('wf-type');if(typ)typ.onchange=()=>{txType=typ.value;render();};const cs=document.getElementById('wf-check-status');if(cs)cs.onchange=()=>{checkStatus=cs.value;render();};const settings=document.getElementById('wf-settings');if(settings)settings.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(settings));x.remindersEnabled=settings.elements.remindersEnabled.checked;x.budgetTarget=Number(x.budgetTarget||0);x.guestTarget=Number(x.guestTarget||0);x.reminderDays=Number(x.reminderDays||7);try{await api('saveSettings',x);await refresh();}catch(err){document.getElementById('wf-settings-msg').textContent=err.message||String(err);}};}
function bindOwner(){document.querySelectorAll('aside button').forEach(b=>{const x=b.textContent.trim();if(['Cowo','Cewe','Bersama'].includes(x))b.onclick=()=>{owner=x;localStorage.setItem('wf-owner',owner);if(badge)badge.textContent='Data tersambung · '+owner;};});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
bindOwner();if(badge)badge.textContent='Menghubungkan spreadsheet…';
api('getAppSnapshot').then(x=>{db=x;render();if(badge)badge.textContent='Data tersambung · '+owner;}).catch(e=>{root.innerHTML='<div class="wf-notice">Koneksi gagal: '+esc(e.message||e)+'. Periksa Script Properties dan jalankan setupDatabase().</div>';if(badge)badge.textContent='Koneksi gagal';});
})();
</script>
